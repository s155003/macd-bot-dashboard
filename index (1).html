<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MACD Bot · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-2: #0f1419;
    --bg-3: #161c23;
    --border: #1f2731;
    --text: #c9d1d9;
    --text-dim: #6e7681;
    --text-bright: #f0f6fc;
    --accent: #58a6ff;
    --green: #3fb950;
    --green-glow: rgba(63, 185, 80, 0.15);
    --red: #f85149;
    --red-glow: rgba(248, 81, 73, 0.15);
    --yellow: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88, 166, 255, 0.06), transparent),
      var(--bg);
  }
  .container { max-width: 1600px; margin: 0 auto; padding: 24px; }

  /* Header */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .brand {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text-bright);
    letter-spacing: -0.02em;
  }
  .brand .accent { color: var(--accent); }
  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .pulse.disconnected { background: var(--red); box-shadow: 0 0 8px var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .grid.charts { grid-template-columns: 2fr 1fr; }
  .grid.bottom { grid-template-columns: 1fr 1fr; }

  /* Panels */
  .panel {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    position: relative;
  }
  .panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 10px;
    background: var(--accent);
    border-radius: 1px;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-bright);
    font-feature-settings: 'tnum';
  }
  .stat-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .yellow { color: var(--yellow); }
  .dim { color: var(--text-dim); }

  /* Chart panels */
  .chart-panel { padding: 16px; }
  .chart-panel .panel-title { margin-bottom: 12px; }
  #priceChart, #macdChart { width: 100%; height: 360px; }
  #equityChart { width: 100%; height: 240px; }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th {
    text-align: left;
    font-weight: 500;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 8px;
    border-bottom: 1px solid rgba(31, 39, 49, 0.5);
    font-feature-settings: 'tnum';
  }
  td.num { text-align: right; }
  tr:hover td { background: var(--bg-3); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .badge.buy { background: var(--green-glow); color: var(--green); }
  .badge.sell { background: var(--red-glow); color: var(--red); }
  .badge.check { background: rgba(110, 118, 129, 0.2); color: var(--text-dim); }
  .badge.error { background: var(--red-glow); color: var(--red); }
  .badge.trade { background: rgba(188, 140, 255, 0.15); color: var(--purple); }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--accent); color: var(--text-bright); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  button.primary:hover { opacity: 0.9; color: var(--bg); }
  button.danger { color: var(--red); border-color: rgba(248, 81, 73, 0.3); }

  /* Event log */
  .event-log {
    max-height: 320px;
    overflow-y: auto;
  }
  .event-log::-webkit-scrollbar { width: 6px; }
  .event-log::-webkit-scrollbar-track { background: var(--bg); }
  .event-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .empty {
    color: var(--text-dim);
    font-style: italic;
    padding: 16px;
    text-align: center;
  }
  .timestamp {
    color: var(--text-dim);
    font-size: 11px;
  }
  .config-line {
    font-size: 11px;
    color: var(--text-dim);
  }
  .config-line .key { color: var(--text); }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .grid.charts, .grid.bottom { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="brand">macd<span class="accent">·</span>bot</div>
      <div class="config-line" id="config-line">loading…</div>
    </div>
    <div class="live-indicator">
      <span class="pulse" id="pulse"></span>
      <span id="connection-status">connecting</span>
      <span style="margin-left: 16px;" id="server-time"></span>
    </div>
  </header>

  <!-- Top stats row -->
  <div class="grid">
    <div class="panel">
      <div class="panel-title">Equity</div>
      <div class="stat-value" id="stat-equity">—</div>
      <div class="stat-sub" id="stat-equity-sub">—</div>
    </div>
    <div class="panel">
      <div class="panel-title">Day P&L</div>
      <div class="stat-value" id="stat-pnl">—</div>
      <div class="stat-sub" id="stat-pnl-sub">—</div>
    </div>
    <div class="panel">
      <div class="panel-title">Buying Power</div>
      <div class="stat-value" id="stat-bp">—</div>
      <div class="stat-sub" id="stat-cash">—</div>
    </div>
    <div class="panel">
      <div class="panel-title">Bot Status</div>
      <div class="stat-value" id="stat-bot">—</div>
      <div class="stat-sub controls" style="margin-top: 8px;">
        <button id="btn-start" class="primary">Start</button>
        <button id="btn-stop" class="danger">Stop</button>
        <button id="btn-once">Run once</button>
      </div>
    </div>
  </div>

  <!-- Charts row -->
  <div class="grid charts">
    <div class="panel chart-panel">
      <div class="panel-title">Price + Crossovers <span class="dim" id="chart-symbol"></span></div>
      <div id="priceChart"></div>
      <div id="macdChart" style="margin-top: 8px;"></div>
    </div>
    <div class="panel chart-panel">
      <div class="panel-title">Equity Curve</div>
      <div id="equityChart"></div>
      <div class="panel-title" style="margin-top: 16px;">Open Positions</div>
      <div id="positions-table"></div>
    </div>
  </div>

  <!-- Bottom row: events + orders -->
  <div class="grid bottom">
    <div class="panel">
      <div class="panel-title">Bot Decision Log</div>
      <div class="event-log" id="event-log">
        <div class="empty">No events yet — start the bot or hit "Run once".</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Recent Orders</div>
      <div id="orders-table"></div>
    </div>
  </div>
</div>

<script>
const fmt = {
  money: (n) => n == null ? '—' : '$' + n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}),
  pct:   (n) => n == null ? '—' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%',
  num:   (n, d=2) => n == null ? '—' : n.toFixed(d),
  time:  (s) => s ? new Date(s).toLocaleTimeString() : '—',
};

async function fetchJSON(url, opts = {}) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

// --- Header config line ---
async function loadConfig() {
  try {
    const c = await fetchJSON('/api/config');
    const cfg = `${c.symbol} · qty ${c.qty} · interval ${c.interval_sec}s · ` +
                (c.alpaca_configured ? '<span class="green">alpaca connected</span>' : '<span class="red">alpaca not configured</span>');
    document.getElementById('config-line').innerHTML = cfg;
    document.getElementById('chart-symbol').textContent = '· ' + c.symbol;
  } catch (e) { /* ignore */ }
}

// --- Account stats ---
async function loadAccount() {
  try {
    const a = await fetchJSON('/api/account');
    if (!a.configured) {
      document.getElementById('stat-equity').innerHTML = '<span class="dim">offline</span>';
      document.getElementById('stat-equity-sub').textContent = 'set ALPACA_API_KEY';
      return;
    }
    if (a.error) {
      document.getElementById('stat-equity').innerHTML = '<span class="red">error</span>';
      document.getElementById('stat-equity-sub').textContent = a.error;
      return;
    }
    document.getElementById('stat-equity').textContent = fmt.money(a.equity);
    document.getElementById('stat-equity-sub').textContent = `prev close ${fmt.money(a.last_equity)}`;

    const pnlEl = document.getElementById('stat-pnl');
    const pnlClass = a.day_pnl >= 0 ? 'green' : 'red';
    pnlEl.className = 'stat-value ' + pnlClass;
    pnlEl.textContent = (a.day_pnl >= 0 ? '+' : '') + fmt.money(a.day_pnl).replace('$', '$');
    document.getElementById('stat-pnl-sub').innerHTML = `<span class="${pnlClass}">${fmt.pct(a.day_pnl_pct)}</span>`;

    document.getElementById('stat-bp').textContent = fmt.money(a.buying_power);
    document.getElementById('stat-cash').textContent = `cash ${fmt.money(a.cash)}`;
  } catch (e) { console.error(e); }
}

// --- Bot control ---
async function loadBotStatus() {
  try {
    const s = await fetchJSON('/api/bot/status');
    const el = document.getElementById('stat-bot');
    if (s.running) {
      el.innerHTML = '<span class="green">running</span>';
    } else {
      el.innerHTML = '<span class="dim">stopped</span>';
    }
  } catch (e) { /* ignore */ }
}

document.getElementById('btn-start').onclick = async () => {
  await fetch('/api/bot/start', {method: 'POST'});
  loadBotStatus();
};
document.getElementById('btn-stop').onclick = async () => {
  await fetch('/api/bot/stop', {method: 'POST'});
  loadBotStatus();
};
document.getElementById('btn-once').onclick = async () => {
  document.getElementById('btn-once').textContent = 'Running...';
  try {
    await fetch('/api/bot/run-once', {method: 'POST'});
    loadEvents();
  } finally {
    document.getElementById('btn-once').textContent = 'Run once';
  }
};

// --- Positions table ---
async function loadPositions() {
  try {
    const positions = await fetchJSON('/api/positions');
    const el = document.getElementById('positions-table');
    if (!positions.length) {
      el.innerHTML = '<div class="empty">No open positions</div>';
      return;
    }
    let html = '<table><thead><tr><th>Symbol</th><th class="num">Qty</th><th class="num">Avg</th><th class="num">P&L</th></tr></thead><tbody>';
    for (const p of positions) {
      const cls = p.unrealized_pl >= 0 ? 'green' : 'red';
      html += `<tr>
        <td><strong>${p.symbol}</strong></td>
        <td class="num">${p.qty}</td>
        <td class="num">${fmt.money(p.avg_entry_price)}</td>
        <td class="num ${cls}">${fmt.money(p.unrealized_pl)} (${fmt.pct(p.unrealized_plpc)})</td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch (e) {
    document.getElementById('positions-table').innerHTML = '<div class="empty">Could not load positions</div>';
  }
}

// --- Orders table ---
async function loadOrders() {
  try {
    const orders = await fetchJSON('/api/orders?limit=15');
    const el = document.getElementById('orders-table');
    if (!orders.length) {
      el.innerHTML = '<div class="empty">No recent orders</div>';
      return;
    }
    let html = '<table><thead><tr><th>Time</th><th>Side</th><th>Symbol</th><th class="num">Qty</th><th class="num">Price</th><th>Status</th></tr></thead><tbody>';
    for (const o of orders) {
      const sideClass = o.side === 'buy' ? 'buy' : 'sell';
      html += `<tr>
        <td class="timestamp">${fmt.time(o.submitted_at)}</td>
        <td><span class="badge ${sideClass}">${o.side}</span></td>
        <td><strong>${o.symbol}</strong></td>
        <td class="num">${o.qty}</td>
        <td class="num">${o.filled_avg_price ? fmt.money(o.filled_avg_price) : '—'}</td>
        <td class="dim">${o.status}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch (e) {
    document.getElementById('orders-table').innerHTML = '<div class="empty">Could not load orders</div>';
  }
}

// --- Event log ---
async function loadEvents() {
  try {
    const events = await fetchJSON('/api/events?limit=30');
    renderEvents(events);
  } catch (e) { /* ignore */ }
}

function renderEvents(events) {
  const el = document.getElementById('event-log');
  if (!events.length) {
    el.innerHTML = '<div class="empty">No events yet</div>';
    return;
  }
  let html = '<table><thead><tr><th>Time</th><th>Kind</th><th>Cross</th><th>Price</th><th>Message</th></tr></thead><tbody>';
  for (const e of events) {
    let kindBadge = `<span class="badge ${e.kind}">${e.kind}</span>`;
    if (e.kind === 'trade' && e.side) {
      kindBadge = `<span class="badge ${e.side}">${e.side}</span>`;
    }
    let crossDisplay = '<span class="dim">—</span>';
    if (e.crossover === 'bullish') crossDisplay = '<span class="green">▲ bull</span>';
    else if (e.crossover === 'bearish') crossDisplay = '<span class="red">▼ bear</span>';
    else if (e.crossover === 'none') crossDisplay = '<span class="dim">flat</span>';

    html += `<tr>
      <td class="timestamp">${fmt.time(e.timestamp)}</td>
      <td>${kindBadge}</td>
      <td>${crossDisplay}</td>
      <td class="num">${e.price ? fmt.money(e.price) : '—'}</td>
      <td>${e.message || ''}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

// --- Charts ---
const plotLayoutBase = {
  paper_bgcolor: 'transparent',
  plot_bgcolor: 'transparent',
  font: { family: 'JetBrains Mono, monospace', size: 11, color: '#c9d1d9' },
  margin: { l: 50, r: 20, t: 10, b: 30 },
  xaxis: { gridcolor: '#1f2731', linecolor: '#1f2731', zerolinecolor: '#1f2731' },
  yaxis: { gridcolor: '#1f2731', linecolor: '#1f2731', zerolinecolor: '#1f2731' },
  showlegend: true,
  legend: { x: 0, y: 1, bgcolor: 'rgba(15, 20, 25, 0.8)', bordercolor: '#1f2731', borderwidth: 1, font: { size: 10 } },
  hovermode: 'x unified',
};

async function loadChart() {
  try {
    const c = await fetchJSON('/api/chart');
    if (c.error) {
      document.getElementById('priceChart').innerHTML = `<div class="empty">${c.error}</div>`;
      return;
    }

    // Price chart with crossover markers
    const priceTrace = {
      x: c.dates, y: c.close, type: 'scatter', mode: 'lines',
      name: 'Close', line: { color: '#58a6ff', width: 2 },
    };
    const bullTrace = {
      x: c.bullish_dates, y: c.bullish_prices, type: 'scatter', mode: 'markers',
      name: '▲ Bullish', marker: { color: '#3fb950', size: 12, symbol: 'triangle-up', line: { color: '#0a0e14', width: 1 } },
    };
    const bearTrace = {
      x: c.bearish_dates, y: c.bearish_prices, type: 'scatter', mode: 'markers',
      name: '▼ Bearish', marker: { color: '#f85149', size: 12, symbol: 'triangle-down', line: { color: '#0a0e14', width: 1 } },
    };
    Plotly.newPlot('priceChart', [priceTrace, bullTrace, bearTrace],
      { ...plotLayoutBase, height: 280, yaxis: { ...plotLayoutBase.yaxis, title: 'Price' } },
      { displayModeBar: false, responsive: true });

    // MACD chart
    const macdTrace = { x: c.dates, y: c.macd, type: 'scatter', mode: 'lines', name: 'MACD', line: { color: '#6e7681', width: 1, dash: 'dot' } };
    const smoothTrace = { x: c.dates, y: c.smooth_macd, type: 'scatter', mode: 'lines', name: 'Smoothed MACD', line: { color: '#bc8cff', width: 2 } };
    const signalTrace = { x: c.dates, y: c.signal, type: 'scatter', mode: 'lines', name: 'Signal', line: { color: '#d29922', width: 1.5 } };
    Plotly.newPlot('macdChart', [macdTrace, smoothTrace, signalTrace],
      { ...plotLayoutBase, height: 200, yaxis: { ...plotLayoutBase.yaxis, title: 'MACD' } },
      { displayModeBar: false, responsive: true });
  } catch (e) {
    document.getElementById('priceChart').innerHTML = `<div class="empty">Chart unavailable: ${e.message}</div>`;
  }
}

async function loadEquity() {
  try {
    const e = await fetchJSON('/api/equity');
    if (!e.available || !e.timestamps || !e.timestamps.length) {
      document.getElementById('equityChart').innerHTML = '<div class="empty">Equity history unavailable</div>';
      return;
    }
    const dates = e.timestamps.map(t => new Date(t * 1000).toISOString().slice(0, 10));
    const trace = {
      x: dates, y: e.equity, type: 'scatter', mode: 'lines',
      fill: 'tozeroy', fillcolor: 'rgba(88, 166, 255, 0.08)',
      line: { color: '#58a6ff', width: 2 }, name: 'Equity',
    };
    Plotly.newPlot('equityChart', [trace],
      { ...plotLayoutBase, height: 220, showlegend: false, yaxis: { ...plotLayoutBase.yaxis, title: '$' } },
      { displayModeBar: false, responsive: true });
  } catch (err) {
    document.getElementById('equityChart').innerHTML = '<div class="empty">Equity history unavailable</div>';
  }
}

// --- WebSocket for live event updates ---
function connectWS() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('pulse').classList.remove('disconnected');
    document.getElementById('connection-status').textContent = 'live';
  };
  ws.onclose = () => {
    document.getElementById('pulse').classList.add('disconnected');
    document.getElementById('connection-status').textContent = 'reconnecting…';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'event') {
      // New event arrived — refresh the log
      loadEvents();
      loadBotStatus();
    } else if (msg.type === 'snapshot') {
      renderEvents(msg.data.events);
    }
  };
  // Keepalive ping
  setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 30000);
}

// --- Server time ---
setInterval(() => {
  document.getElementById('server-time').textContent = new Date().toLocaleTimeString();
}, 1000);

// --- Initial load + polling ---
loadConfig();
loadAccount();
loadPositions();
loadOrders();
loadEvents();
loadBotStatus();
loadChart();
loadEquity();
connectWS();

// Refresh account/positions periodically
setInterval(() => {
  loadAccount();
  loadPositions();
  loadOrders();
  loadBotStatus();
}, 15000);
// Refresh chart less often (cheaper)
setInterval(loadChart, 5 * 60 * 1000);
</script>
</body>
</html>
